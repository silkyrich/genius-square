<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>Puzzle Party — race your friends</title>
<meta name="description" content="Genius Square, Sudoku and Boggle in one party. Start a party, share a code, race your friends.">
<meta property="og:title" content="Puzzle Party — race your friends">
<meta property="og:description" content="Genius Square, Sudoku and Boggle in one party. Start a party, share a code, race your friends.">
<meta property="og:image" content="https://genius-square.richmorgan.co.uk/og.jpg">
<meta property="og:type" content="website">
<meta name="twitter:card" content="summary_large_image">
<link rel="icon" type="image/png" href="/icon.png">
<link rel="apple-touch-icon" href="/icon.png">
<meta name="theme-color" content="#1c1a17">
<link rel="stylesheet" href="/style.css">
</head>
<body>
<header>
	<img src="/icon.png" alt="" id="logo">
	<h1>Puzzle Party</h1>
	<button id="btn-theme" title="dark / light">◐</button>
	<div id="who">
		<span id="identity"></span>
		<button id="btn-login" hidden>sign in</button>
		<button id="btn-logout">log out</button>
	</div>
</header>

<main>
	<!-- landing page (shown at / until you start) -->
	<section id="landing" hidden>
		<img src="/hero.svg" alt="Puzzle Party games" id="hero-img">
		<h2>Race your friends. Any puzzle, one party.</h2>
		<p class="muted">Start a party, share the code or QR, then swap between Genius Square,
		Sudoku and Boggle round by round. Scores roll up across every game.</p>
		<button id="btn-start" class="primary big">Start a party</button>
		<div id="join-row">
			<input id="join-code" placeholder="or enter a party code" maxlength="4" autocapitalize="characters">
			<button id="btn-join">Join</button>
		</div>
		<h3 id="parties-head" hidden>Open parties</h3>
		<div id="public-parties"></div>
	</section>

	<!-- share / party strip -->
	<section id="room-strip" hidden>
		<span id="room-label"></span>
		<button id="btn-share">Share party</button>
		<button id="btn-qr">QR</button>
	</section>

	<!-- winner / round banner -->
	<div id="banner" hidden></div>

	<!-- lobby -->
	<section id="lobby" hidden>
		<h2 id="lobby-title"></h2>
		<div id="master-controls" hidden>
			<div id="game-cards"></div>
			<div id="game-options"></div>
			<button id="btn-propose" class="primary">Set up the round</button>
		</div>
		<div id="proposal-card" hidden>
			<p id="proposal-text"></p>
			<div id="agree-row">
				<button id="btn-agree" class="primary">I'm ready</button>
				<button id="btn-force" hidden>Start anyway</button>
			</div>
			<p id="agreed-list" class="muted"></p>
		</div>
	</section>

	<!-- the game -->
	<section id="play-area" hidden>
		<div id="game-root"></div>
		<div id="status-bar">
			<span id="timer">0.0s</span>
			<span id="game-status"></span>
		</div>
		<p id="round-game-label" class="muted"></p>
	</section>

	<!-- room chat -->
	<section id="chat-panel" hidden>
		<div id="chat-log"></div>
		<form id="chat-form">
			<input id="chat-input" placeholder="say something…" maxlength="300" autocomplete="off">
			<button class="primary">Send</button>
		</form>
	</section>

	<!-- players & scores -->
	<section id="players-panel" hidden>
		<div id="score-header">
			<h2>Party scores</h2>
			<span id="round-label" class="muted"></span>
		</div>
		<div id="players"></div>
		<div id="party-settings" hidden>
			<label>Theme <select id="theme-select"></select></label>
			<label><input type="checkbox" id="public-toggle"> discoverable — list this party on the front page</label>
		</div>
		<div id="master-room-controls" hidden>
			<button id="btn-end-round">End round</button>
			<button id="btn-clear-room">Clear round</button>
			<button id="btn-reset-scores">Reset scores</button>
		</div>
	</section>
</main>

<!-- name modal -->
<dialog id="name-modal">
	<h2>Who's playing?</h2>
	<button id="btn-google" type="button" class="google">
		<svg width="16" height="16" viewBox="0 0 48 48" aria-hidden="true"><path fill="#4285F4" d="M45.1 24.5c0-1.6-.1-3.1-.4-4.5H24v8.5h11.8c-.5 2.8-2.1 5.1-4.4 6.7v5.5h7.1c4.2-3.9 6.6-9.6 6.6-16.2z"/><path fill="#34A853" d="M24 46c6 0 10.9-2 14.5-5.3l-7.1-5.5c-2 1.3-4.5 2.1-7.4 2.1-5.7 0-10.5-3.8-12.2-9H4.5v5.7C8.1 41.2 15.5 46 24 46z"/><path fill="#FBBC05" d="M11.8 28.3c-.4-1.3-.7-2.8-.7-4.3s.2-3 .7-4.3V14H4.5C3 17 2.1 20.4 2.1 24s.9 7 2.4 10l7.3-5.7z"/><path fill="#EA4335" d="M24 10.7c3.2 0 6.1 1.1 8.4 3.3l6.3-6.3C34.9 4.2 30 2 24 2 15.5 2 8.1 6.8 4.5 14l7.3 5.7c1.7-5.2 6.5-9 12.2-9z"/></svg>
		Sign in with Google
	</button>
	<p class="muted">or play as a guest</p>
	<form method="dialog">
		<input id="name-input" placeholder="your name" maxlength="24" required autocomplete="name">
		<button class="primary">Play</button>
	</form>
</dialog>

<!-- QR modal -->
<dialog id="qr-modal">
	<div id="qr-box"></div>
	<p id="qr-link" class="muted"></p>
	<form method="dialog"><button>Close</button></form>
</dialog>

<script type="module" src="/app.js"></script>
</body>
</html>
